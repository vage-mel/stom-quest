<html lang="ru">
<head>

  <meta name="theme-color" content="#3d7a72" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="description" content="Офлайн-квест: экзамен по стоматологии для Марины" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>Экзамен · КГМУ</title>
  <style>
    :root {
      --ink: #1c2a2e;
      --muted: #5a6f76;
      --mint: #7eb8b0;
      --mint-deep: #3d7a72;
      --blush: #e07a6a;
      --cream: #f3f0ea;
      --paper: #fbf8f3;
      --line: rgba(28, 42, 46, 0.12);
      --shadow: 0 18px 50px rgba(28, 42, 46, 0.12);
      /* Только системные шрифты — без интернета */
      --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Times New Roman", Georgia, serif;
      --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      color: var(--ink);
      font-family: var(--font-body);
      background:
        radial-gradient(ellipse 80% 50% at 10% -10%, rgba(126, 184, 176, 0.35), transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 0%, rgba(224, 122, 106, 0.18), transparent 50%),
        linear-gradient(165deg, #e8f2f0 0%, var(--cream) 45%, #e6ebe8 100%);
    }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px 32px;
    }

    .shell {
      width: min(520px, 100%);
      position: relative;
    }

    .progress {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
    }

    .progress span {
      flex: 1;
      height: 4px;
      border-radius: 99px;
      background: rgba(28, 42, 46, 0.1);
      transition: background 0.4s ease, transform 0.3s ease;
    }

    .progress span.on {
      background: linear-gradient(90deg, var(--mint-deep), var(--mint));
      transform: scaleY(1.3);
    }

    .progress span.done {
      background: var(--mint-deep);
    }

    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 28px 24px 24px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
      animation: rise 0.55s ease both;
    }

    .card.has-hero {
      padding-top: 0;
    }

    .hero-building {
      display: block;
      width: calc(100% + 48px);
      max-width: none;
      margin: 0 -24px 18px;
      height: min(42vw, 210px);
      object-fit: cover;
      object-position: center 55%;
      border-bottom: 1px solid var(--line);
      animation: rise 0.8s ease both;
      background: linear-gradient(180deg, #d8ebe8 0%, #eef4f1 100%);
    }

    .hero-building svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .stage-art {
      margin: 0 0 16px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: linear-gradient(160deg, #e5f1ef, #f6f1ea);
      height: 168px;
      animation: rise 0.55s ease both;
    }

    .stage-art svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 3px;
      background: linear-gradient(90deg, var(--mint-deep), var(--blush));
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--mint-deep);
      margin-bottom: 12px;
    }

    .badge::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--blush);
      box-shadow: 0 0 0 3px rgba(224, 122, 106, 0.25);
    }

    h1, h2 {
      font-family: var(--font-display);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin: 0 0 12px;
    }

    h1 { font-size: clamp(32px, 8vw, 42px); }
    h2 { font-size: clamp(24px, 6vw, 30px); }

    .lead, .scene {
      color: var(--muted);
      font-size: 15.5px;
      line-height: 1.65;
      margin: 0 0 18px;
    }

    .scene em {
      color: var(--ink);
      font-style: italic;
      font-family: var(--font-display);
      font-size: 1.15em;
    }

    .hearts {
      color: var(--blush);
      font-size: 13px;
      letter-spacing: 0.3em;
      margin-bottom: 8px;
      opacity: 0.85;
    }

    .choices {
      display: grid;
      gap: 10px;
      margin-top: 8px;
    }

    .choice {
      appearance: none;
      width: 100%;
      text-align: left;
      border: 1.5px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 14px;
      padding: 14px 16px;
      font: inherit;
      font-size: 14.5px;
      font-weight: 500;
      line-height: 1.45;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s, background 0.2s;
    }

    .choice:hover {
      border-color: var(--mint-deep);
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(61, 122, 114, 0.12);
    }

    .choice:active { transform: translateY(0); }

    .choice.correct-flash {
      border-color: var(--mint-deep);
      background: rgba(126, 184, 176, 0.18);
    }

    .choice.wrong-flash {
      border-color: var(--blush);
      background: rgba(224, 122, 106, 0.12);
      animation: shake 0.35s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    .feedback {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      display: none;
    }

    .feedback.show { display: block; animation: rise 0.35s ease both; }
    .feedback.ok {
      background: rgba(126, 184, 176, 0.2);
      color: #2a5550;
    }
    .feedback.bad {
      background: rgba(224, 122, 106, 0.15);
      color: #8a3d34;
    }

    .btn {
      appearance: none;
      border: none;
      border-radius: 999px;
      padding: 14px 22px;
      font: inherit;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      background: linear-gradient(135deg, var(--mint-deep), #4f9a90);
      color: #fff;
      width: 100%;
      margin-top: 8px;
      box-shadow: 0 10px 24px rgba(61, 122, 114, 0.28);
      transition: transform 0.15s, filter 0.15s;
    }

    .btn:hover { filter: brightness(1.05); transform: translateY(-1px); }
    .btn.secondary {
      background: transparent;
      color: var(--mint-deep);
      border: 1.5px solid var(--mint-deep);
      box-shadow: none;
      margin-top: 10px;
    }

    .score {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 16px;
      font-weight: 600;
    }

    .score b { color: var(--ink); }

    .surprise {
      text-align: center;
      padding: 8px 4px 4px;
    }

    .surprise .big {
      font-family: var(--font-display);
      font-size: clamp(28px, 7vw, 36px);
      line-height: 1.2;
      margin: 10px 0 16px;
    }

    .surprise .letter {
      text-align: left;
      background: #fff;
      border: 1px dashed rgba(224, 122, 106, 0.45);
      border-radius: 16px;
      padding: 18px 16px;
      color: var(--ink);
      font-size: 15px;
      line-height: 1.7;
      margin: 16px 0;
    }

    .surprise .letter p { margin: 0 0 12px; }
    .surprise .letter p:last-child { margin: 0; }

    .tooth {
      font-size: 42px;
      line-height: 1;
      margin: 8px 0 4px;
      animation: bounce 1.6s ease infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .footer-note {
      text-align: center;
      margin-top: 14px;
      font-size: 12px;
      color: var(--muted);
    }

    .hidden { display: none !important; }
  </style>
</head>

    const card = document.getElementById("card");
    const progressEl = document.getElementById("progress");

    function renderProgress() {
      const n = STAGES.length;
      progressEl.innerHTML = "";
      for (let i = 0; i < n; i++) {
        const s = document.createElement("span");
        if (state.stage > i) s.classList.add("done");
        if (state.stage === i) s.classList.add("on");
        progressEl.appendChild(s);
      }
      progressEl.classList.toggle("hidden", state.stage < 0);
    }

    function renderIntro() {
      state.stage = -1;
      state.score = 0;
      renderProgress();
      card.style.animation = "none";
      void card.offsetWidth;
      card.style.animation = "";
      card.classList.add("has-hero");
      card.innerHTML = `
        <div class="hero-building" role="img" aria-label="Здание КГМУ">${BUILDING_SVG}</div>
        <div class="badge">Небольшой квест</div>
        <h1>Экзамен по стоматологии</h1>
        <p class="lead">
          Для <b>${escapeHtml(CONFIG.herNameFull)}</b> — студентки КГМУ.<br/>
          5 испытаний. Правильные ответы ведут дальше.
        </p>
        <button class="btn" id="start">Начать экзамен</button>
      `;
      document.getElementById("start").onclick = () => goStage(0);
    }

    function goStage(i) {
      state.stage = i;
      state.locked = false;
      renderProgress();
      const s = STAGES[i];
      card.style.animation = "none";
      void card.offsetWidth;
      card.style.animation = "";
      card.classList.remove("has-hero");
      card.innerHTML = `
        <div class="stage-art" role="img" aria-hidden="true">${ILLUSTRATIONS[s.id] || ""}</div>
        <div class="score">
          <span>Этап ${i + 1} из ${STAGES.length}</span>
          <span>Верных: <b>${state.score}</b></span>
        </div>
        <div class="badge">${escapeHtml(s.badge)}</div>
        <h2>${escapeHtml(s.title)}</h2>
        <p class="scene">${s.scene}</p>
        <p class="lead" style="color:var(--ink);font-weight:600;margin-bottom:10px;">${escapeHtml(s.question)}</p>
        <div class="choices" id="choices"></div>
        <div class="feedback" id="feedback"></div>
        <button class="btn hidden" id="next">Дальше</button>
      `;

      const choicesEl = document.getElementById("choices");
      s.choices.forEach((c, idx) => {
        const btn = document.createElement("button");
        btn.className = "choice";
        btn.type = "button";
        btn.textContent = c.text;
        btn.onclick = () => onChoose(c, btn);
        choicesEl.appendChild(btn);
      });

      document.getElementById("next").onclick = () => {
        if (state.stage >= STAGES.length - 1) renderSurprise();
        else goStage(state.stage + 1);
      };
    }

    function onChoose(choice, btn) {
      if (state.locked) return;
      const feedback = document.getElementById("feedback");
      const next = document.getElementById("next");

      if (!choice.correct) {
        btn.classList.add("wrong-flash");
        feedback.className = "feedback show bad";
        feedback.textContent = choice.bad || "Не то. Попробуй другой вариант.";
        setTimeout(() => btn.classList.remove("wrong-flash"), 400);
        return;
      }

      state.locked = true;
      state.score += 1;
      btn.classList.add("correct-flash");
      document.querySelectorAll(".choice").forEach((el) => {
        if (el !== btn) el.style.opacity = "0.45";
        el.style.pointerEvents = "none";
      });
      feedback.className = "feedback show ok";
      feedback.textContent = choice.ok || "Верно!";
      next.classList.remove("hidden");
      renderProgress();
      document.querySelector(".score b").textContent = String(state.score);
    }

    function renderSurprise() {
      state.stage = STAGES.length;
      renderProgress();
      card.style.animation = "none";
      void card.offsetWidth;
      card.style.animation = "";
      card.classList.remove("has-hero");

      const paragraphs = CONFIG.surpriseBody
        .map((p) => `<p>${escapeHtml(p)}</p>`)
        .join("");

      const cta = CONFIG.ctaUrl
        ? `<a class="btn" href="${escapeAttr(CONFIG.ctaUrl)}" target="_blank" rel="noopener">${escapeHtml(CONFIG.ctaLabel)}</a>`
        : "";

      card.innerHTML = `
        <div class="surprise">
          <div class="tooth" aria-hidden="true">🦷</div>
          <div class="badge">От ${escapeHtml(CONFIG.hisName)}</div>
          <div class="big">${escapeHtml(CONFIG.surpriseTitle)}</div>
          <div class="letter">${paragraphs}</div>
          <p class="lead" style="margin-bottom:8px;">${escapeHtml(CONFIG.hisName)}</p>
          ${cta}
          <button class="btn secondary" id="replay">Пройти ещё раз</button>
        </div>
      `;

      document.getElementById("replay").onclick = renderIntro;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function escapeAttr(str) {
      return escapeHtml(str).replace(/'/g, "&#39;");
    }

    /** Письмо тебе при открытии (нужен интернет). 1 раз за вкладку. */
    function notifyOpened() {
      const email = CONFIG.notifyEmail;
      if (!email || !navigator.onLine) return;
      if (sessionStorage.getItem("stom-quest-mail-sent")) return;
      sessionStorage.setItem("stom-quest-mail-sent", "1");

      fetch(`https://formsubmit.co/ajax/${encodeURIComponent(email)}`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Accept: "application/json",
        },
        body: JSON.stringify({
          _subject: "Квест КГМУ открыли",
          _template: "table",
          _captcha: "false",
          name: "stom-quest",
          message: `Страницу квеста для ${CONFIG.herName} открыли.`,
          when: new Date().toLocaleString("ru-RU", { timeZone: "Europe/Moscow" }),
          page: String(location.href),
        }),
      }).catch(() => {});
    }

    renderIntro();
    notifyOpened();

    // Офлайн: после одного открытия по ссылке кэшируется в браузере
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  </script>
</body>
